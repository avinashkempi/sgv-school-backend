name: Daily School Cron Jobs

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST (Exam reminders)
    - cron: '30 1 * * *'
    # 02:30 UTC = 08:00 AM IST (Birthdays & Events)
    - cron: '30 2 * * *'
    # 03:30 UTC on 1st of month = 09:00 AM IST (Monthly Fee Reminders)
    - cron: '30 3 1 * *'
    # 14:30 UTC = 08:00 PM IST (Event Eve Reminders)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to trigger (all-daily, birthday, event, exam, or fees)'
        required: false
        default: 'all-daily'

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SGV School Backend Cron Webhook
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://sgv-school-backend.onrender.com' }}
          TARGET_JOB: ${{ github.event.inputs.job || 'all-daily' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub repository secrets"
            exit 1
          fi
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::BACKEND_URL is not configured"
            exit 1
          fi

          echo "🚀 Triggering SGV School cron job: $TARGET_JOB at $(date -u)"

          case "$TARGET_JOB" in
            birthday) ENDPOINT="/api/webhooks/cron/birthday-notifications" ;;
            event)    ENDPOINT="/api/webhooks/cron/event-notifications" ;;
            exam)     ENDPOINT="/api/webhooks/cron/exam-reminders" ;;
            fees)     ENDPOINT="/api/webhooks/cron/monthly-fee-reminders" ;;
            *)        ENDPOINT="/api/webhooks/cron/all-daily" ;;
          esac

          HTTP_STATUS="$(curl --silent --show-error --fail-with-body \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url "${BACKEND_URL}${ENDPOINT}" \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 || echo "$?")"

          if [ -f response.json ]; then
            cat response.json
            echo ""
          fi

          echo "HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "✅ Successfully triggered cron endpoint"
